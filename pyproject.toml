[project]
name = "texy"
description = "Supercharge text processing"
readme = "README.md"
requires-python = ">=3.6"
version = "0.0.2"
authors = [{ name = "Mamunur Rahaman Mamun", email = "mdmmn378@gmail.com" }]
dependencies = [
    "psutil>=7.0.0",
    "memory-profiler>=0.61.0",
    "maturin>=0.12.20",
]

[project.scripts]
texy-memory-test = "memory_leak_detector:main"

[project.urls]
homepage = "https://github.com/mdmmn378/texy"
repository = "https://github.com/mdmmn378/texy"

[build-system]
requires = ["maturin>=1.0.0,<=2.0.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.isort]
profile = "black"

[tool.uv]
dev-dependencies = ["maturin>=0.12.20"]

[tool.uv.sources]
